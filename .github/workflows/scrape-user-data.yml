name: Scrape User Data

on:
  workflow_dispatch:
    inputs:
      games:
        description: 'Comma-separated games to scrape (maimai,chunithm). Overrides config.json.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: scrape-user-data
  cancel-in-progress: true

jobs:
  scrape-user-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Determine which games to scrape
        id: games
        env:
          REQUESTED_GAMES: ${{ github.event.inputs.games }}
        run: |
          if [ -n "$REQUESTED_GAMES" ]; then
            GAMES_JSON=$(printf '%s' "$REQUESTED_GAMES" | jq -R -c 'split(",") | map(ascii_downcase | gsub("^\\s+|\\s+$"; "")) | map(select(. != "")) | unique')
          else
            GAMES_JSON=$(jq -c '[.games[]? | tostring | ascii_downcase | gsub("^\\s+|\\s+$"; "") | select(. != "")] | unique' config.json)
          fi

          INVALID_GAMES=$(printf '%s' "$GAMES_JSON" | jq -r '[.[] | select(. != "maimai" and . != "chunithm")] | join(",")')
          if [ -n "$INVALID_GAMES" ]; then
            echo "::error::Unsupported game(s): $INVALID_GAMES"
            exit 1
          fi

          if [ "$(printf '%s' "$GAMES_JSON" | jq 'length')" -eq 0 ]; then
            echo "::error::No games configured to scrape"
            exit 1
          fi

          MAIMAI_VERSION=$(jq -r '.game_versions.maimai.scraper // empty' config.json)
          CHUNITHM_VERSION=$(jq -r '.game_versions.chunithm.scraper // empty' config.json)

          if printf '%s' "$GAMES_JSON" | jq -e 'index("maimai") != null' >/dev/null && [ -z "$MAIMAI_VERSION" ]; then
            echo "::error::config.json is missing game_versions.maimai.scraper"
            exit 1
          fi
          if printf '%s' "$GAMES_JSON" | jq -e 'index("chunithm") != null' >/dev/null && [ -z "$CHUNITHM_VERSION" ]; then
            echo "::error::config.json is missing game_versions.chunithm.scraper"
            exit 1
          fi

          GAMES=$(printf '%s' "$GAMES_JSON" | jq -r 'join(",")')
          echo "games=$GAMES" >> "$GITHUB_OUTPUT"
          echo "maimai=$(printf '%s' "$GAMES_JSON" | jq -r 'index("maimai") != null')" >> "$GITHUB_OUTPUT"
          echo "chunithm=$(printf '%s' "$GAMES_JSON" | jq -r 'index("chunithm") != null')" >> "$GITHUB_OUTPUT"
          echo "maimai_version=$MAIMAI_VERSION" >> "$GITHUB_OUTPUT"
          echo "chunithm_version=$CHUNITHM_VERSION" >> "$GITHUB_OUTPUT"
          echo "games: $GAMES"

      - name: Create outputs directory
        run: mkdir -p outputs

      - name: Scrape maimai
        if: steps.games.outputs.maimai == 'true'
        env:
          MAIMAI_SERVICE_URL: ${{ secrets.MAIMAI_SERVICE_URL || 'https://maimai.wonderhoy.me' }}
          MAIMAI_SERVICE_API_KEY: ${{ secrets.MAIMAI_SERVICE_API_KEY }}
        run: |
          docker run \
            --rm \
            -v ${{ github.workspace }}/outputs:/app/outputs \
            -e VERSION="${{ steps.games.outputs.maimai_version }}" \
            -e USERNAME=${{ secrets.SEGA_USERNAME }} \
            -e PASSWORD=${{ secrets.SEGA_PASSWORD }} \
            -e MAIMAI_SERVICE_URL="$MAIMAI_SERVICE_URL" \
            -e MAIMAI_SERVICE_API_KEY="$MAIMAI_SERVICE_API_KEY" \
            ghcr.io/leomotors/maimai-scraper:v1

      - name: Scrape chunithm
        if: steps.games.outputs.chunithm == 'true'
        env:
          CHUNI_SERVICE_URL: ${{ secrets.CHUNI_SERVICE_URL || 'https://chuni.wonderhoy.me' }}
          CHUNI_SERVICE_API_KEY: ${{ secrets.CHUNI_SERVICE_API_KEY }}
        run: |
          docker run \
            --rm \
            -v ${{ github.workspace }}/outputs:/app/outputs \
            -e VERSION="${{ steps.games.outputs.chunithm_version }}" \
            -e USERNAME=${{ secrets.SEGA_USERNAME }} \
            -e PASSWORD=${{ secrets.SEGA_PASSWORD }} \
            -e CHUNI_SERVICE_URL="$CHUNI_SERVICE_URL" \
            -e CHUNI_SERVICE_API_KEY="$CHUNI_SERVICE_API_KEY" \
            ghcr.io/leomotors/chunithm-scraper:v6

      - name: Install uv and dependencies
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        working-directory: scraper
        run: uv sync

      - name: Import user data into database
        working-directory: scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python import_user_data.py "${{ github.workspace }}/outputs"
